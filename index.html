<style>
:root{
  --royal:#1f4fd8;--royal-osc:#1638a8;--royal-claro:#edf2ff;
  --tinta:#0d1b4c;--gris:#5a6488;--linea:#e3e9fb;
  --glitter:linear-gradient(#1f4fd8,#1f4fd8); /* al cargar se cambia por la textura de brillo */
  --radio:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Jost',system-ui,sans-serif;line-height:1.45;color:var(--tinta);background:#fff;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}

/* Brillitos que titilan */
.brillos{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.brillos span,.chispa{position:absolute;color:var(--royal);opacity:0;text-shadow:0 0 8px #9db8ff;animation:titila var(--d) ease-in-out var(--r) infinite}
.brillos span.cl{color:#8fb0ff}
@keyframes titila{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(30deg)}}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:18px 16px 40px}

/* Marca: logo */
.marca{position:relative;text-align:center;padding:16px 0 4px}
.insignia{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;background:#fff;box-shadow:0 6px 22px rgba(31,79,216,.25)}
.insignia img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.redes{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.redes a{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--royal);background:#fff;color:var(--royal);font-weight:500;font-size:.92rem;text-decoration:none}
.redes a:active{background:var(--royal-claro)}
.redes svg{width:1.15rem;height:1.15rem;flex:0 0 auto}
.redes .ig{color:#e1306c}
.redes .tt{color:#000}
.redes .wa{color:#25d366}
.modo-admin .insignia,.modo-admin .redes,.modo-admin .chispa{display:none}
.saludo{display:none;align-items:center;justify-content:center;gap:12px;color:var(--royal);font-size:.98rem;font-weight:500;letter-spacing:.03em}
.saludo::before,.saludo::after{content:"";width:44px;height:2px;border-radius:2px;background:var(--glitter) 0 0/120px,var(--royal)}
.modo-admin .saludo{display:flex;margin-bottom:4px}
.modo-admin .marca{padding-top:30px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lema{position:relative;font-family:'Pinyon Script',cursive;font-size:3.1rem;line-height:1.3;margin:10px 0 -.3em;padding:.05em .3em .4em;
  background:var(--glitter) 0 0/200px,var(--royal);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Pestañas */
.tabs{display:flex;gap:4px;padding:4px;margin:18px 0 16px;border-radius:999px;background:#fff;border:1.5px solid var(--royal)}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:999px;font-weight:500;font-size:.98rem;color:var(--tinta)}
.tabs button.activo{color:#fff;background:var(--glitter) 0 0/200px,var(--royal)}

/* Tarjetas */
.tarjeta{position:relative;background:#fff;border:1.5px solid var(--linea);border-radius:var(--radio);padding:18px;margin-bottom:14px;scroll-margin-top:12px}
.paso{display:flex;align-items:center;gap:12px;font-family:'Pinyon Script',cursive;font-size:1.9rem;font-weight:400;line-height:1.2;color:#000;margin-bottom:10px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--royal);border:1.5px solid var(--royal)}
.sub{color:var(--gris);font-size:.92rem;margin:4px 0}
.opc{color:var(--gris);font-weight:400}
.vacio{text-align:center;color:var(--gris);padding:10px}

/* Servicios */
.servicios{display:grid}
.servicio{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:15px 6px;text-align:left;background:none;border:0;border-bottom:1px solid var(--linea);font-weight:500;font-size:1.02rem}
.servicio:last-child{border-bottom:0}
.servicio b{font-weight:500}
.servicio.sel{color:var(--royal)}
.servicio.sel b::before{content:"✦ "}
.servicio.sel::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--glitter) 0 0/200px,var(--royal)}

/* Calendario */
.cal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-cab b{text-transform:capitalize;font-weight:600}
.icono{width:36px;height:36px;border:0;border-radius:50%;background:var(--royal-claro);color:var(--royal);font-size:1.3rem;line-height:1}
.icono:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dsem{font-size:.78rem;font-weight:500;color:var(--gris);padding:4px 0}
.dia{aspect-ratio:1;border:1.5px solid transparent;border-radius:50%;background:none;font-weight:500;color:#b9c1db}
.dia:disabled{cursor:default}
.dia.libre{background:#fff;color:var(--tinta);border-color:var(--linea)}
.dia.hoy{text-decoration:underline 2px #9db4f5;text-underline-offset:3px}
.leyenda{font-size:.82rem;color:var(--gris);margin-top:10px;text-align:center}

/* Horas */
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:8px}
.hora{padding:10px 4px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;font-weight:500;font-size:.95rem}
.dia.sel,.hora.sel,.tira button.sel{background:var(--glitter) 0 0/160px,var(--royal);color:#fff;border-color:transparent;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--royal)}

/* Formularios */
label{display:block;font-weight:500;font-size:.92rem;margin:12px 0 6px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:14px;background:#fff;font:inherit;color:var(--tinta)}
input:focus,select:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 4px rgba(31,79,216,.14)}
.foto{display:grid;place-items:center;min-height:110px;border:1.5px dashed var(--royal);border-radius:18px;background:var(--royal-claro);color:var(--royal);cursor:pointer;overflow:hidden;font-weight:500;margin:0}
.foto img{width:100%;max-height:260px;object-fit:cover}
.resumen ul{list-style:none;display:grid;gap:8px;margin-bottom:6px;font-weight:500}

/* Botones */
.boton{position:relative;overflow:hidden;display:block;width:100%;padding:15px;border:0;border-radius:999px;font-weight:500;font-size:1.05rem;letter-spacing:.02em;color:#fff;background:var(--glitter) 0 0/300px,var(--royal);box-shadow:0 8px 20px rgba(31,79,216,.3);margin-top:10px}
.boton::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:destello 3.2s ease-in-out infinite}
@keyframes destello{0%{left:-60%}55%,100%{left:130%}}
.boton.sec{background:#fff;color:var(--royal);border:1.5px solid var(--royal);box-shadow:none}
.boton.peligro{background:#d9506e;box-shadow:none}
.boton.sec::after,.boton.peligro::after{display:none}
.mini{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border:0;border-radius:999px;font-weight:500;font-size:.86rem;text-decoration:none}
.mini.ok{background:#dcf5ec;color:#157a5b}
.mini.no{background:#ffe5eb;color:#b3395a}
.mini.wa{background:#dcf8e5;color:#128a48}
.mini.az{background:var(--royal-claro);color:var(--royal)}

/* Estados y citas */
.estado{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:500;white-space:nowrap}
.estado.pendiente{background:#fff1d9;color:#a3610b}
.estado.confirmada{background:#dcf5ec;color:#157a5b}
.estado.cancelada{background:#ffe5eb;color:#b3395a}
.cita{display:flex;gap:12px;padding:14px;margin-top:10px;background:#fff;border:1.5px solid var(--linea);border-radius:16px}
.cita .h{min-width:48px;font-weight:600;color:var(--royal);font-size:.95rem;line-height:1.2}
.cita .h small{font-size:.75rem;font-weight:500}
.cita .info{flex:1;min-width:0}
.cita img{width:56px;height:56px;border-radius:12px;object-fit:cover;cursor:zoom-in}
.cita.apagada{opacity:.6}
.fila-sup{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fila-sup b{font-weight:600}
.acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nota{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;margin-bottom:14px;border-radius:16px;background:var(--royal-claro);border:1.5px solid #cdd9fb;font-size:.95rem}
.buscar{display:flex;gap:8px;margin-top:8px}
.buscar .mini{padding:0 18px}
.exito{text-align:center}
.exito .grande{font-size:2.4rem}
.exito h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:2.8rem;line-height:1.3;margin:0;padding:.05em .3em .4em;
  background:var(--glitter) 0 0/200px,var(--royal);-webkit-background-clip:text;background-clip:text;color:transparent}
.exito p{margin:8px 0}
.pie{text-align:center;margin-top:18px}
.enlace{border:0;background:none;color:var(--gris);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}

/* Panel de la manicurista */
.salir{position:absolute;top:16px;right:16px;z-index:2}
.contador{margin-left:auto;font-family:'Jost',sans-serif;font-size:.85rem;color:#fff;border-radius:999px;padding:2px 11px;background:var(--glitter) 0 0/120px,var(--royal)}
.tira{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 8px;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.tira button{flex:0 0 auto;min-width:54px;min-height:64px;padding:8px 4px;border:1.5px solid var(--linea);border-radius:16px;background:#fff;text-align:center}
.tira small{display:block;font-size:.72rem;color:var(--gris);text-transform:capitalize}
.tira b{font-size:1.05rem;font-weight:600}
.tira i{display:block;width:6px;height:6px;margin:3px auto 0;border-radius:50%;background:var(--royal)}
.tira button.sel small{color:#dbe6ff}
.tira button.sel i{background:#fff}
.dia-titulo{font-weight:600;margin-top:10px}
.fila-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--linea)}
.rango{display:flex;align-items:center;gap:6px}
.rango input{width:auto;padding:8px 10px}
.sw{display:inline-flex;align-items:center;gap:10px;margin:0;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 auto;width:44px;height:26px;padding:0;border:0;border-radius:999px;background:#d5dcef;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw input:checked{background:var(--glitter) 0 0/120px,var(--royal)}
.sw input:checked::after{left:21px}
.bloqueo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-top:8px;border-radius:14px;background:var(--royal-claro);font-size:.92rem}
.serv-edit{padding:12px;margin-bottom:10px;border:1.5px solid var(--linea);border-radius:16px;background:#fff}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dos label{font-size:.82rem;margin:8px 0 0}
.dos input,.dos select{margin-top:4px;padding:9px 10px;font-size:.95rem}
.serv-edit .mini{margin-top:10px}

/* Aviso, ventana de confirmación y visor de fotos */
.aviso{position:fixed;left:50%;top:12px;z-index:50;display:flex;align-items:center;gap:12px;width:min(440px,calc(100% - 32px));padding:12px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--linea);box-shadow:0 14px 34px rgba(13,27,76,.18);opacity:0;transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.aviso.ver{opacity:1;transform:translate(-50%,0)}
.aviso .ic{font-size:1.5rem}
.aviso b{font-weight:600}
.aviso small{display:block;color:var(--gris);font-size:.86rem}
.nueva{position:fixed;left:50%;bottom:16px;z-index:60;display:none;align-items:center;gap:10px;width:min(440px,calc(100% - 32px));padding:10px 10px 10px 16px;border-radius:999px;background:var(--tinta);color:#fff;font-size:.92rem;box-shadow:0 14px 34px rgba(13,27,76,.3);transform:translateX(-50%)}
.nueva.ver{display:flex}
.nueva span{flex:1}
.nueva button{border:0;border-radius:999px;padding:8px 16px;background:#fff;color:var(--royal);font:inherit;font-weight:600}
.modal,.visor{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:rgba(13,27,76,.35);backdrop-filter:blur(4px)}
.modal.ver,.visor.ver{display:grid}
.caja{width:min(380px,100%);padding:22px;border-radius:22px;background:#fff;text-align:center}
.caja h3{font-weight:600;margin-bottom:6px}
.caja p{color:var(--gris);font-size:.94rem}
.caja .izq{text-align:left}
.cal-ad{gap:5px}
.dia-ad{aspect-ratio:1/1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border:1.5px solid var(--linea);border-radius:14px;background:#fff}
.dia-ad b{font-weight:600;font-size:1rem}
.dia-ad small{min-width:20px;height:18px;line-height:18px;padding:0 5px;border-radius:999px;background:var(--royal);color:#fff;font-size:.72rem;font-weight:600}
.dia-ad small.pend{background:#e8961c}
.dia-ad small.cero{background:none}
.dia-ad.hoy{border-color:var(--royal)}
.dia-ad.pasado{opacity:.5}
.dia-ad.sel{background:var(--glitter) 0 0/160px,var(--royal);border-color:transparent;color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--royal)}
.dia-ad.sel small{background:#fff;color:var(--royal)}
.punto-pend{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e8961c;vertical-align:middle}
.grupo-serv{font-size:.9rem;font-weight:600;color:var(--gris);margin:12px 0 0}
/* políticas del studio */
.politicas{display:grid;gap:12px;text-align:left}
.politica{display:flex;gap:10px}
.politica .num{width:26px;height:26px;font-size:.8rem;margin-top:1px;background:var(--glitter) 0 0/120px,var(--royal);border-color:transparent;color:#fff}
.politica b{display:block;font-weight:600;font-size:.95rem}
.politica ul,.resumen .politica ul{display:block;list-style:disc;margin:2px 0 0 18px;padding:0;gap:0;color:var(--gris);font-size:.9rem;font-weight:400;line-height:1.4}
.caja-pol{margin:14px 0 4px;padding:14px;border-radius:16px;background:#f6f8ff;border:1.5px solid var(--linea)}
.caja-pol .tit{font-weight:600;margin-bottom:2px}
.acepto{display:flex;align-items:flex-start;gap:10px;margin:14px 0 4px;font-weight:500;cursor:pointer}
.acepto input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--royal)}
.ojo-sis{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff6e6;border:1.5px solid #f6d9a6;font-size:.9rem}
.caja.larga{max-height:calc(100vh - 32px);overflow:auto;text-align:left}
.caja.larga h3{text-align:center}
textarea{width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:14px;background:#fff;font:inherit;font-size:.92rem;color:var(--tinta);resize:vertical;margin-top:8px}
.extra-pies{margin-top:14px;padding-top:4px;border-top:1px solid var(--linea)}
.opciones-pies{display:grid;gap:8px;margin-top:4px}
.opciones-pies .hora{padding:11px 14px}
.clave{position:relative}
.clave input{padding-right:50px}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--gris)}
.ojo svg{width:22px;height:22px}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.etiqueta{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;background:var(--royal-claro);color:var(--royal);font-size:.8rem;font-weight:500}
.dos-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.visor img{max-width:100%;max-height:85vh;border-radius:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.brillos span,.chispa{opacity:.6}}
</style>
</head>

// Explica en palabras simples qué falla en Firebase, para saber qué arreglar
let ultimoError='';
function explicar(e){
  const c=(e&&e.code)||'';
  if(/permission-denied/.test(c))return 'Faltan publicar las reglas de seguridad en Firestore';
  if(/operation-not-allowed|admin-restricted/.test(c))return 'Falta activar ese método de acceso en Firebase (Authentication → Método de acceso)';
  if(/failed-precondition|not-found/.test(c))return 'La base de datos Firestore no está creada';
  if(/network|unavailable/.test(c))return 'Sin conexión a internet';
  if(/api-key|unauthorized-domain|referer/.test(c))return 'Este sitio no está autorizado en Firebase (Dominios autorizados)';
  return 'Error: '+(c||(e&&e.message)||'desconocido');
}
function errorLectura(e){console.error(e);ultimoError=explicar(e);aviso('⚠️','No se pudieron cargar los datos',ultimoError);render()}

}

// Devuelve las horas en que cabe un servicio de "duracion" minutos ese día
function horasLibres(fecha,duracion,ignorar){
  const dia=db.config.horario[deISO(fecha).getDay()];
  if(!dia||!dia.activo)return[];
  const bloq=db.config.bloqueos.filter(b=>b.fecha===fecha);
  if(bloq.some(b=>b.todoDia))return[];
  const ocupado=ocupadosDe(fecha).filter(o=>o.id!==ignorar).map(o=>[o.inicio,o.fin]);
  bloq.forEach(b=>ocupado.push([aMin(b.desde),aMin(b.hasta)]));
  const des=db.config.descanso;
  if(des.activo)ocupado.push([aMin(des.desde),aMin(des.hasta)]);
  let minimo=0;
  if(fecha===hoyISO()){const n=new Date();minimo=n.getHours()*60+n.getMinutes()+ANTICIPACION}
  const libres=[];
  for(let t=aMin(dia.desde);t+duracion<=aMin(dia.hasta);t+=db.config.intervalo){
    if(t<minimo)continue;
    if(ocupado.some(([a,b])=>t<b&&t+duracion>a))continue; // se cruza con algo
    libres.push(aHora(t));
  }
  return libres;
}
function diaReservable(f,duracion,ignorar){
  const d=deISO(f),hoy=deISO(hoyISO()),lim=new Date(hoy);lim.setDate(lim.getDate()+DIAS_MAX);
  return d>=hoy&&d<=lim&&horasLibres(f,duracion,ignorar).length>0;
}
function primerDiaLibre(duracion,ignorar){
  const d=deISO(hoyISO());
  for(let i=0;i<=DIAS_MAX;i++){const f=iso(d);if(horasLibres(f,duracion,ignorar).length)return f;d.setDate(d.getDate()+1)}
  return null;
}

function vCalendario(duracion,n){
  const y=ui.mes.getFullYear(),m=ui.mes.getMonth(),hoy=hoyISO(),d0=deISO(hoy);
  const lim=new Date(d0);lim.setDate(lim.getDate()+DIAS_MAX);
  let celdas=['L','M','M','J','V','S','D'].map(x=>`<div class="dsem">${x}</div>`).join('');
  celdas+='<div></div>'.repeat((new Date(y,m,1).getDay()+6)%7);
  const total=new Date(y,m+1,0).getDate();
  for(let d=1;d<=total;d++){
    const f=iso(new Date(y,m,d)),libre=diaReservable(f,duracion,ui.reprogramando);
    celdas+=`<button class="dia${libre?' libre':''}${f===ui.fecha?' sel':''}${f===hoy?' hoy':''}" ${libre?`onclick="elegirFecha('${f}')"`:'disabled'} aria-label="${fechaLarga(f)}">${d}</button>`;
  }
  const atras=new Date(y,m,1)>new Date(d0.getFullYear(),d0.getMonth(),1);
  const adelante=new Date(y,m+1,1)<=lim;
  return `<section class="tarjeta" id="p2"><div class="paso"><span class="num">${n}</span>Elige el día</div>
    <div class="cal-cab"><button class="icono" onclick="cambiarMes(-1)" ${atras?'':'disabled'} aria-label="Mes anterior">‹</button>
    <b>${MESES[m]} ${y}</b><button class="icono" onclick="cambiarMes(1)" ${adelante?'':'disabled'} aria-label="Mes siguiente">›</button></div>
    <div class="cal">${celdas}</div><p class="leyenda">✨ Los días en blanco tienen horas disponibles</p></section>`;
}

function cargarFoto(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{ // se achica y comprime para que pese poco
      const max=700;let w=img.width,h=img.height;
      if(w>h&&w>max){h=h*max/w;w=max}else if(h>max){w=w*max/h;h=max}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      ui.foto=cv.toDataURL('image/jpeg',.7);render();
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

let guardando=false; // evita guardar dos veces si tocan rápido
async function agendar(){
  if(guardando)return;
  const s=servicio(ui.servicioId),rep=ui.reprogramando?db.citas.find(x=>x.id===ui.reprogramando):null;
  const R=rep?{nombre:nombreServ(rep),duracion:durCita(rep)}:reserva(ui.servicioId,ui.pies);
  if(!horasLibres(ui.fecha,R.duracion,ui.reprogramando).includes(ui.hora)){
    aviso('😕','Esa hora ya no está disponible','Elige otra, porfa');ui.hora=null;render();return;
  }
  let c;
  if(ui.reprogramando){
    c=db.citas.find(x=>x.id===ui.reprogramando);if(!c){cancelarReprog();return}
    guardando=true;const antes=c.fecha+'T'+c.hora; // para que el aviso diga de qué día a qué día la cambió
    const ok=await intentar(()=>cambiarCita(c,{fecha:ui.fecha,hora:ui.hora,estado:'pendiente'}));
    guardando=false;if(!ok)return;
    notificarManicurista(c,'reprogramada',antes);
    ui.hecho=Object.assign({},c,{reprog:true});
  }else{
    const nombre=ui.nombre.trim(),tel=normTel(ui.tel);
    if(nombre.length<2){aviso('✍️','Falta tu nombre','');$('nom').focus();return}
    if(tel.length<10){aviso('📱','Revisa tu número','Debe tener al menos 10 dígitos');$('tel').focus();return}
    if(ui.otroSistema===null){aviso('💅','Cuéntanos si vienes con sistema','Toca Sí o No');bajar('p4');return}
    if(!ui.acepta){aviso('📋','Lee y acepta las políticas','Marca la casilla antes de agendar');bajar('pPol');return}
    // siempre queda pendiente: la confirma Dana (al confirmar envía el precio)
    c={id:nuevoId(),uid:miUid(),servicioId:s.id,servicioNombre:R.nombre,duracion:R.duracion,fecha:ui.fecha,hora:ui.hora,
      nombre,telefono:tel,foto:ui.foto||null,otroSistema:ui.otroSistema,estado:'pendiente',creada:Date.now()};
    guardando=true;
    const ok=await intentar(()=>crearCita(c));
    guardando=false;if(!ok)return;
    notificarManicurista(c,'nueva');
    ui.hecho=c;
  }
  ui.reprogramando=null;ui.servicioId=null;ui.pies=null;ui.fecha=null;ui.hora=null;ui.foto=null;ui.otroSistema=null;ui.acepta=false;
  render();window.scrollTo({top:0,behavior:'smooth'});
}

const hayPush=()=>'serviceWorker' in navigator&&'Notification' in window&&!!(window.firebase&&firebase.messaging);
let tokenMem=''; // por si el navegador no deja guardar
const tokenGuardado=()=>{try{return localStorage.getItem('dn_notif')||tokenMem}catch(e){return tokenMem}};
async function registrarTelefono(){ // pide el código de este teléfono y lo guarda para que el Worker le escriba
  const reg=await navigator.serviceWorker.register('sw.js');
  const token=await firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  if(!token)throw new Error('sin token');
  await fs.collection('tokens').doc(token).set({uid:usuario.uid,creado:Date.now(),equipo:navigator.userAgent.slice(0,140)});
  tokenMem=token;try{localStorage.setItem('dn_notif',token)}catch(e){}
  return token;
}
function vNotif(){
  let estado,boton='';
  if(!VAPID_KEY||!AVISOS_URL)estado='Todavía falta terminar de configurarlas.';
  else if(esIOS()&&!instalada())estado='En iPhone primero agrega la app a la pantalla de inicio y ábrela desde el ícono. Luego entra aquí otra vez.';
  else if(!hayPush())estado='Este navegador no permite notificaciones. Prueba con Chrome en Android o con la app instalada en iPhone.';
  else if(Notification.permission==='denied')estado='Las notificaciones están bloqueadas. Actívalas en los ajustes del teléfono para esta app y vuelve a intentar.';
  else if(Notification.permission==='granted'&&tokenGuardado()){
    estado='✅ Activadas en este teléfono. Te llega un aviso cuando una clienta agenda, cambia o cancela una cita.';
    boton='<button class="mini az" onclick="probarNotif()">Enviar una prueba</button>';
  }else{
    estado='Actívalas para que los avisos te lleguen a la pantalla de notificaciones del teléfono, aunque la app esté cerrada.';
    boton='<button class="boton" onclick="activarNotif()">🔔 Activar notificaciones</button>';
  }
  return `<section class="tarjeta"><div class="paso">🔔 Notificaciones</div><p class="sub">${estado}</p>${boton}</section>`;
}
async function activarNotif(){

    await registrarTelefono();render();
    aviso('🔔','¡Notificaciones activadas!','Toca "Enviar una prueba" para ver cómo llegan');
  }catch(e){console.error(e);aviso('🔔','No se pudieron activar',explicar(e))}
}

// ----- Contraseña de Dana -----
async function cambiarClave(){
  const {a,n,r}=ui.cc;
  if(!a||!n){aviso('🔒','Completa los campos','');return}
  if(n.length<6){aviso('🔒','Contraseña muy corta','Debe tener al menos 6 caracteres');return}
  if(n!==r){aviso('🔒','No coinciden','Escribe la nueva contraseña igual en los dos campos');return}
  const u=auth.currentUser;
  try{
    // Firebase pide confirmar la contraseña actual antes de cambiarla
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,a));
    await u.updatePassword(n);
    ui.cc=null;render();aviso('✅','Contraseña cambiada','Usa la nueva la próxima vez que entres');
  }catch(e){
    const c=e.code||'';
    aviso('🔒','No se pudo cambiar',/wrong-password|invalid-credential/.test(c)?'La contraseña actual no es correcta'
      :c==='auth/weak-password'?'La nueva es muy débil, usa al menos 6 caracteres'
      :c==='auth/too-many-requests'?'Demasiados intentos, espera un rato':'Revisa tu conexión');
  }
}
async function olvideClave(){
  const correo=ui.lgCorreo.trim();
  if(!correo){aviso('📧','Escribe tu correo arriba','Te enviaremos un enlace para crear una contraseña nueva');$('lgCorreo').focus();return}
  try{auth.languageCode='es';await auth.sendPasswordResetEmail(correo);aviso('📧','Revisa tu correo','Te enviamos un enlace para crear una contraseña nueva')}
  catch(e){aviso('📧','No se pudo enviar',e.code==='auth/invalid-email'?'Revisa que el correo esté bien escrito':'Revisa tu conexión')}
}

// ----- Calendario del mes: cuántas citas hay cada día; al tocar un día se ven abajo -----
const mesInicial=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()-2,1)}; // lo más viejo que se carga
function vMesAdmin(){
  if(!ui.adminMes){const d=deISO(ui.adminFecha);ui.adminMes=new Date(d.getFullYear(),d.getMonth(),1)}
  const y=ui.adminMes.getFullYear(),m=ui.adminMes.getMonth(),hoy=hoyISO(),d0=new Date();
  const atras=new Date(y,m,1)>mesInicial(),adelante=new Date(y,m+1,1)<=new Date(d0.getFullYear(),d0.getMonth()+4,1);
  const porDia={};db.citas.forEach(c=>{if(c.estado!=='cancelada')(porDia[c.fecha]=porDia[c.fecha]||[]).push(c)});
  let celdas=['L','M','M','J','V','S','D'].map(x=>`<div class="dsem">${x}</div>`).join('');
  celdas+='<div></div>'.repeat((new Date(y,m,1).getDay()+6)%7);
  for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
    const f=iso(new Date(y,m,d)),l=porDia[f]||[],pend=l.some(c=>c.estado==='pendiente');
    celdas+=`<button class="dia-ad${f===ui.adminFecha?' sel':''}${f===hoy?' hoy':''}${f<hoy?' pasado':''}" onclick="ui.adminFecha='${f}';render();bajar('diaSel')" aria-label="${fechaLarga(f)}: ${l.length} citas"><b>${d}</b><small class="${l.length?(pend?'pend':''):'cero'}">${l.length||''}</small></button>`;
  }
  return `<div class="cal-cab"><button class="icono" onclick="moverMes(-1)" ${atras?'':'disabled'} aria-label="Mes anterior">‹</button>
    <b>${MESES[m]} ${y}</b><button class="icono" onclick="moverMes(1)" ${adelante?'':'disabled'} aria-label="Mes siguiente">›</button></div>
    <div class="cal cal-ad">${celdas}</div>
    <p class="leyenda">El número es cuántas citas hay ese día. <span class="punto-pend"></span> = tiene citas por confirmar</p>`;
}
function moverMes(n){const b=ui.adminMes;ui.adminMes=new Date(b.getFullYear(),b.getMonth()+n,1);render()}

  const n=ui.nueva,s=servicio(n.servicioId),R=reserva(n.servicioId,n.pies),D=n.dur||R?.duracion||150,nombre=n.nombre.trim(),tel=normTel(n.tel);

let porConfirmar=null;
// 50000 -> "50.000" (pesos colombianos, con punto de miles)
const formatoCOP=v=>String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const msgConfirmacion=(c,precio,conPol)=>[

  ...(conPol?['','',textoPoliticas()]:[])
].join('\n');
// opciones de duración: de 30 min a 6 h
const opcionesDur=actual=>{const l=[];for(let m=30;m<=360;m+=30)l.push(m);if(!l.includes(actual))l.push(actual);
  return l.sort((a,b)=>a-b).map(m=>`<option value="${m}"${m===actual?' selected':''}>${dur(m)}</option>`).join('')};
// ¿con esa duración se cruza con otra cita o pasa la hora de cierre?
function choca(fecha,hora,dura,ignorar){
  const a=aMin(hora),b=a+dura,dia=db.config.horario[deISO(fecha).getDay()];
  if(dia?.activo&&b>aMin(dia.hasta))return 'termina después de tu hora de cierre';
  return ocupadosDe(fecha).some(o=>o.id!==ignorar&&a<o.fin&&b>o.inicio)?'se cruza con otra cita':'';
}
function confirmarCita(id){
  const c=db.citas.find(x=>x.id===id);if(!c)return;
  porConfirmar=id;
  $('mpTxt').textContent=`${c.nombre} · ${nombreServ(c)} · ${cap(fechaCorta(c.fecha))} ${hora12(c.hora)}`;
  $('mpDur').innerHTML=opcionesDur(durCita(c));
  $('mpConTel').hidden=!c.telefono;$('mpSinTel').hidden=!!c.telefono; // sin número no hay a quién escribirle
  $('mpPrecio').value='';$('mpPol').checked=true;$('modalPrecio').classList.add('ver');
}
function cerrarPrecio(){$('modalPrecio').classList.remove('ver');porConfirmar=null}
function confirmarConPrecio(conPrecio){
  const c=db.citas.find(x=>x.id===porConfirmar);if(!c)return cerrarPrecio();
  const precio=conPrecio?formatoCOP($('mpPrecio').value):'';
  if(conPrecio&&!precio){aviso('💰','Escribe el precio','O toca "Confirmar sin precio"');$('mpPrecio').focus();return}
  const dura=+$('mpDur').value,cambios={estado:'confirmada'};
  if(dura&&dura!==durCita(c))cambios.duracion=dura;
  const ojo=choca(c.fecha,c.hora,dura||durCita(c),c.id);
  // WhatsApp se abre primero: el teléfono solo lo permite justo al tocar el botón
  if(c.telefono)window.open(waLink(c.telefono,msgConfirmacion(c,precio,$('mpPol').checked)),'_blank');
  cerrarPrecio();
  intentar(()=>cambiarCita(c,cambios)).then(ok=>{if(!ok)return;render();
    if(ojo)aviso('⚠️','Cita confirmada, pero ojo',`Con ${dur(dura)} ${ojo}`);
    else aviso('✅','Cita confirmada',c.telefono?'Envíale el mensaje en WhatsApp':`${c.nombre} · ${cap(fechaCorta(c.fecha))} ${hora12(c.hora)}`)});
}
function cancelarAdmin(id){
  const c=db.citas.find(x=>x.id===id);if(!c)return;
  confirmar('¿Cancelar esta cita?',`${c.nombre} · ${fechaLarga(c.fecha)} a las ${hora12(c.hora)}`,'Sí, cancelar',async()=>{
    if(!await intentar(()=>cambiarCita(c,{estado:'cancelada',canceladaPor:'manicurista'})))return;

    ${B.todo?'':`<div class="rango" style="margin-top:10px"><input type="time" value="${B.desde}" onchange="ui.bloq.desde=this.value"><span>a</span><input type="time" value="${B.hasta}" onchange="ui.bloq.hasta=this.value"></div>`}
    <label for="bM">Motivo <span class="opc">(opcional)</span></label><input id="bM" value="${esc(B.motivo)}" oninput="ui.bloq.motivo=this.value" placeholder="Ej: día libre">

      <button class="mini no" onclick="quitarBloqueo(${b.i})">Quitar</button></div>`).join('')}</section>`;

function setHorario(d,k,v){
  const h=db.config.horario[d],prev=h[k];h[k]=v;
  if(h.activo&&aMin(h.desde)>=aMin(h.hasta)){h[k]=prev;aviso('🕐','Revisa las horas','El cierre debe ser después de la apertura');render();return}
  intentar(guardarConfig).then(ok=>{if(!ok)return;if(k==='activo')render();else aviso('💾','Horario guardado','')});
}
function setDescanso(k,v){
  const d=db.config.descanso,prev=d[k];d[k]=v;
  if(d.activo&&aMin(d.desde)>=aMin(d.hasta)){d[k]=prev;aviso('🕐','Revisa las horas','El final debe ser después del inicio');render();return}
  intentar(guardarConfig).then(ok=>{if(!ok)return;if(k==='activo')render();else aviso('💾','Descanso guardado','')});
}
async function agregarBloqueo(){
  const B=ui.bloq;
  if(!B.fecha){aviso('📅','Elige una fecha','');return}
  if(!B.todo&&aMin(B.desde)>=aMin(B.hasta)){aviso('🕐','Revisa las horas','La hora final debe ser después de la inicial');return}
  const b={fecha:B.fecha,todoDia:B.todo,desde:B.todo?'00:00':B.desde,hasta:B.todo?'23:59':B.hasta,motivo:B.motivo.trim()};
  db.config.bloqueos.push(b);
  db.config.bloqueos.sort((x,y)=>(x.fecha+x.desde).localeCompare(y.fecha+y.desde));
  if(!await intentar(guardarConfig))return;
  ui.bloq={fecha:'',todo:true,desde:'09:00',hasta:'12:00',motivo:''};render();
  const choques=db.citas.filter(c=>c.fecha===b.fecha&&c.estado!=='cancelada'&&aMin(c.hora)<aMin(b.hasta)&&aMin(c.hora)+durCita(c)>aMin(b.desde)).length;
  aviso('🚫','Horario bloqueado',choques?`Ojo: ya tienes ${choques} cita(s) en ese horario`:'Las clientas ya no podrán reservar ahí');
}
async function quitarBloqueo(i){db.config.bloqueos.splice(i,1);if(await intentar(guardarConfig))render()}

function setCfg(k,v){db.config[k]=v;intentar(guardarConfig).then(ok=>{if(!ok)return;if(k==='whatsapp')pintarRedes();aviso('💾','Guardado','')})}
function setServ(i,k,v){
  if(k==='nombre'){v=v.trim();if(!v){render();return}}
  db.servicios[i][k]=v;intentar(guardarConfig).then(ok=>{if(!ok)return;aviso('💾','Servicio guardado','');if(k==='tipo')render()});
}
async function agregarServ(){db.servicios.push({id:'s'+Date.now().toString(36),nombre:'Nuevo servicio',duracion:150,tipo:'manos'});if(await intentar(guardarConfig))render()}
// políticas: se copian a la configuración la primera vez que Dana cambia algo
const misPoliticas=()=>(db.config.politicas||=JSON.parse(JSON.stringify(POLITICAS_BASE)));
function setPol(i,k,v){
  const p=misPoliticas()[i];if(!p)return;
  if(k==='titulo'){v=v.trim();if(!v){render();return}p.titulo=v}
  else p.puntos=v.split('\n').map(x=>x.trim()).filter(Boolean);
  intentar(guardarConfig).then(ok=>{if(ok)aviso('💾','Política guardada','')});
}
async function agregarPol(){misPoliticas().push({titulo:'Nueva política',puntos:[]});if(await intentar(guardarConfig)){render();bajar('aPol')}}
function quitarPol(i){const p=misPoliticas()[i];if(!p)return;
  confirmar('¿Eliminar esta política?',p.titulo,'Sí, eliminar',async()=>{misPoliticas().splice(i,1);if(await intentar(guardarConfig))render()})}
function quitarServ(i){confirmar('¿Eliminar este servicio?',db.servicios[i].nombre,'Sí, eliminar',async()=>{db.servicios.splice(i,1);if(await intentar(guardarConfig))render()})}
function reiniciar(){confirmar('¿Reiniciar datos?','Se borran las citas y ajustes, y vuelven los de ejemplo.','Sí, reiniciar',()=>{db=Object.assign(datosIniciales(),{ocupado:[]});guardarLocal();render();aviso('✨','Listo','Datos de ejemplo restaurados')})}

// ================= Avisos y ventanas =================
let tAviso,accionModal=null;
function aviso(ic,tit,txt){
  $('avIc').textContent=ic;$('avTit').textContent=tit;$('avTxt').textContent=txt||'';
  const a=$('aviso');a.classList.add('ver');clearTimeout(tAviso);tAviso=setTimeout(()=>a.classList.remove('ver'),3800);
}
function confirmar(tit,txt,ok,fn){accionModal=fn;$('mTit').textContent=tit;$('mTxt').textContent=txt;$('mOk').textContent=ok;$('modal').classList.add('ver')}
function cerrarModal(si){$('modal').classList.remove('ver');const f=accionModal;accionModal=null;if(si&&f)f()}

// ================= Brillo (textura glitter azul, como el logo) =================
(function(){
  try{
    const T=300,c=document.createElement('canvas');c.width=c.height=T;
    const x=c.getContext('2d');
    x.fillStyle='#1f4fd8';x.fillRect(0,0,T,T);
    const cols=['#0c2a8f','#1235b0','#1f4fd8','#2f62f2','#4f80ff','#86a9ff','#c9dbff','#ffffff','#63c8ff'];
    for(let i=0;i<14000;i++){ // miles de puntitos de distintos azules
      x.fillStyle=cols[Math.min(cols.length-1,Math.floor(Math.pow(Math.random(),1.7)*cols.length))];
      x.globalAlpha=.45+Math.random()*.55;
      const t=Math.random()<.96?1+Math.random()*1.4:2.4;
      x.fillRect(Math.random()*T,Math.random()*T,t,t);
    }
    x.globalAlpha=1;
    for(let i=0;i<10;i++){ // destellos blancos
      const px=Math.random()*T,py=Math.random()*T,g=x.createRadialGradient(px,py,0,px,py,5);
      g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(px-5,py-5,10,10);
    }
    document.documentElement.style.setProperty('--glitter','url('+c.toDataURL()+')');
  }catch(e){}
})();

// ================= Brillitos que titilan =================
(function(){
  const estrella=()=>Math.random()<.65?'✦':'✧';
  const tiempo=s=>{s.style.setProperty('--d',(2+Math.random()*3).toFixed(1)+'s');s.style.setProperty('--r',(Math.random()*4).toFixed(1)+'s')};
  // por toda la pantalla
  const b=$('brillos');
  for(let i=0;i<18;i++){
    const s=document.createElement('span');s.textContent=estrella();if(i%2)s.className='cl';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=8+Math.random()*10+'px';
    tiempo(s);b.appendChild(s);
  }
  // alrededor del logo
  const m=document.querySelector('.marca');
  for(let i=0;i<7;i++){
    const s=document.createElement('span');s.className='chispa';s.textContent=estrella();s.setAttribute('aria-hidden','true');
    const ang=(i/7)*Math.PI*2+Math.random()*.6,r=90+Math.random()*45;
    s.style.left=`calc(50% + ${Math.cos(ang)*r}px)`;s.style.top=(91+Math.sin(ang)*r)+'px';
    s.style.fontSize=10+Math.random()*10+'px';s.style.margin='-.6em 0 0 -.5em';
    tiempo(s);m.appendChild(s);
  }
})();

$('favicon').href=$('logoImg').src;

// ================= Versión nueva =================
// La app instalada a veces sigue mostrando la versión vieja: al abrirla o volver a ella se revisa si hay una nueva
const VERSION='2026-11-06d'; // cambiar este texto cada vez que se publique un cambio
function revisarVersion(){
  if(!/^https?:$/.test(location.protocol))return;
  fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const v=(t.match(/const VERSION='([^']+)'/)||[])[1];
    if(v&&v!==VERSION)$('nuevaVersion').classList.add('ver');
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')revisarVersion()});
setTimeout(revisarVersion,3000);

iniciar();
